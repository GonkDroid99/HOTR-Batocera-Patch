# HOTR Batocera 43 installer configuration
# This repository is source/scripts only. Large runtime binaries are stored
# in the GitHub prerelease tag configured below.

HOTR_INSTALLER_REPO="GonkDroid99/HOTR-Batocera-Patch"
HOTR_RELEASE_ASSET_REGEX='^HOTR-Batocera43-x86_64\.zip$'

# Binary payload release used by GitHub Actions when creating a normal v* release.
HOTR_BINARY_RELEASE_TAG="binaries-v1"
DUCKSTATION_BINARY_ASSET="duckstation-hotr.tar.gz"
PCSX2_BINARY_ASSET="pcsx2-hotr.tar.gz"
HOTR_BINARY_ASSET="Hook_of_the_Reaper-x86_64.AppImage"

# Optional fallback: the installed bundle already contains the binaries after
# the release workflow assembles it, so these are normally left disabled.
ENABLE_GITHUB_EMULATOR_DOWNLOADS=0
DUCKSTATION_GITHUB_REPO="GonkDroid99/HOTR-Batocera-Patch"
DUCKSTATION_ASSET_REGEX='^duckstation-hotr\.tar\.gz$'
PCSX2_GITHUB_REPO="GonkDroid99/HOTR-Batocera-Patch"
PCSX2_ASSET_REGEX='^pcsx2-hotr\.tar\.gz$'

# MAME State Output Project (MSOP). MAME's native network output does not
# provide recoil for every driver (Alien 3 was verified to expose only
# mame_start/mame_stop without MSOP on MAME 0.285).
MSOP_VERSION="8.4.0"
MSOP_ASSET_URL="https://github.com/djGLiTCH/MAME-LUA-SCRIPT-STATE-OUTPUTS/releases/download/configurator_v1.0.6/MSOP_PLUGIN_v8.4.0_2026.07.03.zip"
