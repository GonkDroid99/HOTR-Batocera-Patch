name: Build HOTR Batocera release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Normal release tag to create/update (example: v1.0.0)"
        required: true
        default: "v1.0.0"
      binary_tag:
        description: "Prerelease containing the large binary payloads"
        required: true
        default: "binaries-v1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  discover-payloads:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.payloads.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      BINARY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.binary_tag || 'binaries-v1' }}
    steps:
      - id: payloads
        name: Find published Batocera payload series
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$BINARY_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          series=()
          for candidate in 43 44; do
            if grep -qx "duckstation-hotr-v$candidate.tar.gz" <<<"$assets" && \
               grep -qx "pcsx2-hotr-v$candidate.tar.gz" <<<"$assets" && \
               grep -qx "emulationstation-hotr-v$candidate.tar.gz" <<<"$assets" && \
               grep -qx "SHA256SUMS-v$candidate" <<<"$assets"; then
              series+=("$candidate")
            fi
          done
          [ "${#series[@]}" -gt 0 ] || { echo "ERROR: no complete v43/v44 payload set in $BINARY_TAG" >&2; exit 2; }
          joined="$(IFS=,; echo "${series[*]}")"
          echo "matrix={\"series\":[$joined]}" >> "$GITHUB_OUTPUT"
          echo "Building installer series: ${series[*]}"

  package:
    needs: discover-payloads
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-payloads.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BINARY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.binary_tag || 'binaries-v1' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Download large binary payload prerelease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hotr-binaries"
          gh release download "$BINARY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/hotr-binaries" \
            --pattern 'duckstation-hotr-v${{ matrix.series }}.tar.gz' \
            --pattern 'pcsx2-hotr-v${{ matrix.series }}.tar.gz' \
            --pattern 'emulationstation-hotr-v${{ matrix.series }}.tar.gz' \
            --pattern 'HookOfTheReaper-x86_64.AppImage' \
            --pattern 'SHA256SUMS-v${{ matrix.series }}'
          ls -lh "$RUNNER_TEMP/hotr-binaries"

      - name: Verify binary payload checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hotr-binaries"
          sha256sum -c "SHA256SUMS-v${{ matrix.series }}"

      - name: Assemble runtime payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payload/emulators/pcsx2/*
          mkdir -p payload/emulators/pcsx2/resources
          curl -fsSL --retry 3 \
            https://github.com/PCSX2/pcsx2_patches/releases/download/latest/patches.zip \
            -o payload/emulators/pcsx2/resources/patches.zip
          unzip -t payload/emulators/pcsx2/resources/patches.zip >/dev/null

          rm -rf payload/emulators/duckstation
          mkdir -p payload/emulators/duckstation payload/emulators/pcsx2 payload/hotr

          rm -rf payload/emulationstation
          mkdir -p payload/emulationstation
          ES_ARCHIVE="$RUNNER_TEMP/hotr-binaries/emulationstation-hotr-v${{ matrix.series }}.tar.gz"
          tar -xzf "$ES_ARCHIVE" -C payload/emulationstation
          test -x payload/emulationstation/emulationstation || { echo "ERROR: native EmulationStation binary missing" >&2; exit 3; }
          test -x payload/emulationstation/emulationstation-standalone || { echo "ERROR: native EmulationStation launcher missing" >&2; exit 3; }

          tar -xzf "$RUNNER_TEMP/hotr-binaries/duckstation-hotr-v${{ matrix.series }}.tar.gz" \
            -C payload/emulators/duckstation

          test -x payload/emulators/duckstation/duckstation-lightgun-qt || { echo "ERROR: DuckStation archive missing duckstation-lightgun-qt" >&2; exit 3; }

          tar -xzf "$RUNNER_TEMP/hotr-binaries/pcsx2-hotr-v${{ matrix.series }}.tar.gz" -C payload/emulators/pcsx2
          test -x payload/emulators/pcsx2/pcsx2-lightgun-qt || { echo "ERROR: PCSX2 archive missing pcsx2-lightgun-qt" >&2; exit 3; }

          install -m 0755 "$RUNNER_TEMP/hotr-binaries/HookOfTheReaper-x86_64.AppImage" \
            payload/hotr/HookOfTheReaper-x86_64.AppImage

          # MameOutputSender belongs beside each emulator.
          test -f payload/emulators/duckstation/MameOutputSender || cp -a reference/bin/duckstation-MameOutputSender payload/emulators/duckstation/MameOutputSender 2>/dev/null || true
          test -x payload/emulators/duckstation/MameOutputSender || chmod +x payload/emulators/duckstation/MameOutputSender 2>/dev/null || true
          test -f payload/emulators/pcsx2/MameOutputSender || cp -a reference/bin/pcsx2-MameOutputSender payload/emulators/pcsx2/MameOutputSender 2>/dev/null || true
          test -x payload/emulators/pcsx2/MameOutputSender || chmod +x payload/emulators/pcsx2/MameOutputSender 2>/dev/null || true

          test -x payload/emulators/duckstation/MameOutputSender || { echo 'ERROR: DuckStation MameOutputSender is missing.' >&2; exit 4; }
          test -x payload/emulators/pcsx2/MameOutputSender || { echo 'ERROR: PCSX2 MameOutputSender is missing.' >&2; exit 4; }

          find payload/emulators -maxdepth 2 -type f -printf '%p %k KB\n' | sort
          ls -lh payload/hotr/HookOfTheReaper-x86_64.AppImage

      - name: Build self-contained installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-release.sh
          HOTR_RELEASE_SERIES="${{ matrix.series }}" ./build-release.sh
          sha256sum "dist/HOTR-Batocera${{ matrix.series }}-x86_64.zip" > "dist/HOTR-Batocera${{ matrix.series }}-x86_64.zip.sha256"
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOTR-Batocera${{ matrix.series }}-x86_64
          path: |
            dist/HOTR-Batocera${{ matrix.series }}-x86_64.zip
            dist/HOTR-Batocera${{ matrix.series }}-x86_64.zip.sha256

      - name: Create/update normal GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HOTR Batocera ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/HOTR-Batocera${{ matrix.series }}-x86_64.zip
            dist/HOTR-Batocera${{ matrix.series }}-x86_64.zip.sha256
