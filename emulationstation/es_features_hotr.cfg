<?xml version="1.0" encoding="UTF-8"?>
<!-- Minimal HOTR-specific ES options. Add more <feature> entries later as your custom emulator settings settle. -->
<features>
  <emulator name="duckstation" features="">
    <cores>
      <core name="duckstation-lightgun" features="use_guns">
        <feature name="MAMEHOOKER / HOTR OUTPUT" group="LIGHT GUN" value="duckstation_mamehooker" description="Send DuckStation output events to MameOutputSender and Hook of the Reaper.">
          <choice name="Enabled" value="true"/><choice name="Disabled" value="false"/>
        </feature>
      </core>
    </cores>
  </emulator>
  <emulator name="pcsx2-lightgun" features="use_guns">
    <cores>
      <core name="pcsx2-lightgun" features="use_guns">
        <feature name="MAMEHOOKER / HOTR OUTPUT" group="LIGHT GUN" value="pcsx2_mamehooker" description="Send PCSX2 output events to MameOutputSender and Hook of the Reaper.">
          <choice name="Enabled" value="true"/><choice name="Disabled" value="false"/>
        </feature>
      </core>
    </cores>
  </emulator>
</features>
