<?xml version="1.0" encoding="UTF-8"?>
<systemList>
  <system>
    <name>psx-hotr</name>
    <fullname>PlayStation HOTR</fullname>
    <manufacturer>Sony</manufacturer>
    <release>1994</release>
    <hardware>console</hardware>
    <path>/userdata/roms/psx</path>
    <extension>.cue .img .mdf .pbp .toc .cbn .m3u .ccd .chd .iso .zip .7z</extension>
    <!-- %CONTROLLERSCONFIG% must expand as separate argv entries. The wrapper
         therefore receives SYSTEM first and then passes everything else through. -->
    <command>/userdata/system/hotr/bin/hotr-configgen-launch psx-hotr %CONTROLLERSCONFIG% -rom %ROM%</command>
    <platform>psx</platform>
    <theme>psx</theme>
    <emulators>
      <emulator name="duckstation">
        <cores><core default="true">duckstation-lightgun</core></cores>
      </emulator>
    </emulators>
  </system>

  <system>
    <name>ps2-hotr</name>
    <fullname>PlayStation 2 HOTR</fullname>
    <manufacturer>Sony</manufacturer>
    <release>2000</release>
    <hardware>console</hardware>
    <path>/userdata/roms/ps2</path>
    <extension>.iso .mdf .nrg .bin .img .dump .gz .cso .chd .m3u</extension>
    <command>/userdata/system/hotr/bin/hotr-configgen-launch ps2-hotr %CONTROLLERSCONFIG% -rom %ROM%</command>
    <platform>ps2</platform>
    <theme>ps2</theme>
    <emulators>
      <emulator name="pcsx2-lightgun">
        <cores><core default="true">pcsx2-lightgun</core></cores>
      </emulator>
    </emulators>
  </system>
</systemList>
